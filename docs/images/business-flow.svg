<svg xmlns="http://www.w3.org/2000/svg" width="680" height="736" viewBox="0 0 680 736" role="img" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
<title>나비 사업 흐름도</title>
<desc>사업계획이 우선순위를 정한다. 마케팅이 19세 이상 입문 방송자를 커뮤니티에서 직접 모집한다. 방송자가 시청자에게 링크를 공유하고, 시청자는 가입 없이 본다. 시청자가 꿀을 충전해 후원하면 나비 몫 12~20%와 방송자 정산 80~88%로 나뉜다. 방송자 정산은 등급 상승과 재방송으로, 시청자는 나도 방송하기로 방송자가 되고, 나비 몫은 지표와 손익 측정으로 사업계획에 돌아간다. 운영 안전장치(신고와 제재, 19세 미만 충전 금지, 같은 명의 후원 정산 보류)가 돈의 흐름을 지킨다.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#9c9a92" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="736" fill="#1f1f1e"/>
<g font-size="12" fill="#c2c0b6" dominant-baseline="central">
<rect x="190" y="40" width="300" height="56" rx="8" fill="#3d3d3a" stroke="#73726c" stroke-width="0.8"/>
<text x="340" y="58" text-anchor="middle" font-size="14" font-weight="500" fill="#f1efe8">사업계획</text>
<text x="340" y="78" text-anchor="middle" fill="#b4b2a9">북극성 지표 · 손익분기 1,019꿀</text>
<line x1="340" y1="96" x2="340" y2="146" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#a)"/>
<text x="352" y="122">무엇을 먼저 할지</text>
<rect x="210" y="150" width="260" height="56" rx="8" fill="#3C3489" stroke="#7F77DD" stroke-width="0.8"/>
<text x="340" y="168" text-anchor="middle" font-size="14" font-weight="500" fill="#EEEDFE">마케팅</text>
<text x="340" y="188" text-anchor="middle" fill="#AFA9EC">커뮤니티에서 직접 모집</text>
<line x1="420" y1="206" x2="488" y2="266" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#a)"/>
<text x="472" y="230">19세 이상 입문 방송자</text>
<rect x="380" y="270" width="240" height="56" rx="8" fill="#3C3489" stroke="#7F77DD" stroke-width="0.8"/>
<text x="500" y="288" text-anchor="middle" font-size="14" font-weight="500" fill="#EEEDFE">방송자</text>
<text x="500" y="308" text-anchor="middle" fill="#AFA9EC">설치 없이 브라우저로 방송</text>
<rect x="60" y="270" width="240" height="56" rx="8" fill="#3C3489" stroke="#7F77DD" stroke-width="0.8"/>
<text x="180" y="288" text-anchor="middle" font-size="14" font-weight="500" fill="#EEEDFE">시청자</text>
<text x="180" y="308" text-anchor="middle" fill="#AFA9EC">링크로 가입 없이 시청</text>
<line x1="378" y1="290" x2="304" y2="290" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#a)"/>
<text x="340" y="258" text-anchor="middle">링크 공유</text>
<line x1="302" y1="310" x2="376" y2="310" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b)"/>
<text x="340" y="344" text-anchor="middle">나도 방송하기</text>
<line x1="200" y1="326" x2="262" y2="396" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#a)"/>
<text x="214" y="368" text-anchor="end">꿀 충전 · 후원</text>
<rect x="170" y="400" width="340" height="56" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="0.8"/>
<text x="340" y="418" text-anchor="middle" font-size="14" font-weight="500" fill="#E1F5EE">꿀 충전과 후원</text>
<text x="340" y="438" text-anchor="middle" fill="#5DCAA5">1꿀 = 1원 · 부가세 10% 별도</text>
<line x1="280" y1="456" x2="196" y2="536" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#a)"/>
<text x="222" y="490" text-anchor="end">12~20%</text>
<line x1="400" y1="456" x2="484" y2="536" stroke="#9c9a92" stroke-width="1.5" marker-end="url(#a)"/>
<text x="458" y="490">80~88%</text>
<rect x="60" y="540" width="240" height="56" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="0.8"/>
<text x="180" y="558" text-anchor="middle" font-size="14" font-weight="500" fill="#E1F5EE">나비 몫</text>
<text x="180" y="578" text-anchor="middle" fill="#5DCAA5">카드 수수료는 나비가 부담</text>
<rect x="380" y="540" width="240" height="56" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="0.8"/>
<text x="500" y="558" text-anchor="middle" font-size="14" font-weight="500" fill="#E1F5EE">방송자 정산</text>
<text x="500" y="578" text-anchor="middle" fill="#5DCAA5">월 1회 · 25일 자동</text>
<path d="M620 568 L652 568 L652 298 L624 298" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b)"/>
<text x="640" y="432" text-anchor="end">등급 상승 · 재방송</text>
<path d="M60 568 L28 568 L28 68 L186 68" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b)"/>
<text x="40" y="450">지표 · 손익 측정</text>
<rect x="60" y="640" width="560" height="56" rx="8" fill="#791F1F" stroke="#E24B4A" stroke-width="0.8"/>
<text x="340" y="658" text-anchor="middle" font-size="14" font-weight="500" fill="#FCEBEB">운영 안전장치가 돈의 흐름을 지킴</text>
<text x="340" y="678" text-anchor="middle" fill="#F09595">신고와 제재 · 19세 미만 충전 금지 · 같은 명의 후원은 정산 보류</text>
</g>
</svg>
